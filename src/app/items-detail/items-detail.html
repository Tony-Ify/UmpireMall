<div class="container" *ngIf="product">
  <!-- Back Button -->
  <button class="back-btn" routerLink="/products">← Back to Products</button>
  
  
  <div class="product-detail">
    
    <div class="image-section">
      <img src="product.imageUrl" alt="product.name">
    </div>
    <div class="info-section">
      <h1>{{ product.name }}</h1>
      <p class="category">Category: {{ category }}</p>
      <p class="rating"> {{ product.rating }} / 5</p>
      <p class="description">{{ product.description }}</p>
      <p class="price">${{ product.price }}</p>
    
      
      <!-- Action Buttons -->
      <div class="actions">
        <button 
          *ngIf="!isInCart" 
          class="add-btn" 
          (click)="addToCart()">
          Add to Cart
        </button>
        
        <button 
          *ngIf="isInCart" 
          class="remove-btn" 
          (click)="removeFromCart()">
          Remove from Cart
        </button>
      </div>
      
      <!-- Cart Status Message -->
      <div *ngIf="isInCart" class="cart-message">
        ✓ This item is in your cart
      </div>
    </div>
  </div>
</div>

<!-- Loading State -->
<div *ngIf="!product" class="loading">
  Loading product details...
</div>
