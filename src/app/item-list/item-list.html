<div class="item-list-container">
  <h1 class="title">Our Products</h1>
  
  <div class="search-container">
    <input 
      type="text" 
      [(ngModel)]="searchTerm"
      (input)="onSearch()"
      placeholder="Search products..."
      class="search-input"
    >
    <button *ngIf="searchTerm" (click)="clearSearch()" class="clear-btn">✕</button>
  </div>
  
  <div class="products-grid" *ngIf="!loading">
    <div 
      *ngFor="let product of filteredProducts" 
      class="product-card"
      [class.selected]="productService.isInCart(product.id)"
      (click)="navigateToProduct(product)"
    >
      <img src="product.imageUrl" alt="product.name" class="product-image">
      <div class="product-info">
        <h3 class="product-name">{{ product.name }}</h3>
        <p class="product-category">{{ product.category }}</p>
        <div class="product-footer">
          <span class="product-price">{{ product.price | currency }}</span>
          <div class="rating">
            <span class="stars">{{ getStars(product.rating) }}</span>
            <span class="rating-value">{{ product.rating }}</span>
          </div>
        </div>
        <button 
          class="add-to-cart-btn"
          [class.in-cart]="productService.isInCart(product.id)"
          (click)="addToCart($event, product)"
        >
          {{ productService.isInCart(product.id) ? '✓ In Cart' : 'Add to Cart' }}
        </button>
      </div>
    </div>
  </div>
  
  <div class="loading" *ngIf="loading">
    <div class="spinner"></div>
    <p>Loading products...</p>
  </div>
  
  <div class="no-results" *ngIf="!loading && filteredProducts.length === 0">
    <p>No products found matching "{{ searchTerm }}"</p>
  </div>
</div>
